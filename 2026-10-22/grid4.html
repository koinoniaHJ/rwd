<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그리드</title>
    <style>
        main {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 50px;
        }
        .item {
            padding: 30px;
            background-color: lightblue;
        }

        .item1 { grid-area: 1 / 3; }
        .item2 { grid-area: 1 / 2; }
        .item4 { grid-area: 2 / 3; }
        .item5 { grid-area: 2 / 2; }

    </style>
</head>
<body>
    <main>
        <section class="item item1">1</section>
        <section class="item item2">2</section>
        <section class="item item3">3</section>
        <section class="item item4">4</section>
        <section class="item item5">5</section>
        <section class="item item6">6</section>
    </main>    
</body>
</html>
